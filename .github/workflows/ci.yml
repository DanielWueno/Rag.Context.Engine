# CI mínimo: compila la solución y corre la suite de tests.
#
# Deliberadamente NO incluye: umbrales de cobertura, análisis estático como gate,
# ni jobs de publicación. Este repo lo desarrolla una persona y el objetivo del CI
# es detectar que algo dejó de compilar o que un test se puso rojo — no imponer
# ceremonia. Ver docs/analisis-futuro/ejecucion-plan.estado.json, ítem 1.7.
#
# Ítem 19.6: el runner NO tiene Qdrant, modelos ONNX descargados ni Ollama. Los tests
# que los necesitan declaran un Trait("Category", ...) explícito (RequiereQdrant,
# RequiereOnnx, RequiereOllama; ver tests/RagEngine.Core.Tests/TestCategories.cs).
# El paso "Tests" corre todo lo demás y es el gate real. Los tests con infraestructura
# se EXCLUYEN por filtro (no se ejecutan contra un runner desnudo para que fallen) y el
# paso "Resumen de tests excluidos" publica cuántos son: nunca cuentan como pasados.
# Si algún día se aprueba levantar Qdrant/descargar modelos en CI, es este el lugar
# donde ejecutarlos.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cachear paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar
        run: dotnet restore RagEngine.slnx

      - name: Compilar
        run: dotnet build RagEngine.slnx --configuration Release --no-restore

      - name: Tests (sin infraestructura externa)
        run: >
          dotnet test tests/RagEngine.Core.Tests/RagEngine.Core.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category!=RequiereQdrant&Category!=RequiereOnnx&Category!=RequiereOllama"
          --logger "console;verbosity=normal"

      - name: Resumen de tests excluidos (requieren infraestructura que este runner no tiene)
        run: |
          set -euo pipefail
          {
            echo "### Tests excluidos de este CI (NO cuentan como pasados)"
            echo
            echo "| Categoría | Casos descubiertos |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for categoria in RequiereQdrant RequiereOnnx RequiereOllama; do
            n=$(dotnet test tests/RagEngine.Core.Tests/RagEngine.Core.Tests.csproj \
                  --configuration Release --no-build --list-tests \
                  --filter "Category=$categoria" \
                | sed -n '/^The following Tests are available:/,$p' | tail -n +2 \
                | grep -c '[^[:space:]]' || true)
            echo "| $categoria | $n |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Tests excluidos::$categoria: $n tests no ejecutados en este runner (sin infraestructura)"
          done

      # Solo fixtures: nunca ejecutar el job local contra corpus/modelos privados
      # desde pull_request, ni usar un runner self-hosted para este workflow.
      - name: Contratos del gate de eval nocturno (sin servicios)
        run: python3 -m unittest discover -s infra/eval-nocturno -p 'test_runner.py'

      - name: Ejecutar verificación de advertencias (14.2)
        run: |
          set -euo pipefail
          ./infra/ci/verify_warning.sh 2>&1 | tee /tmp/ci_build_output.txt || true
          # Emitir anotaciones de GitHub Actions para cada warning reconocido
          grep -i "warning" /tmp/ci_build_output.txt || true
          # Parse typical 'file(line,column): warning CODE: message' or dotnet style
          awk 'BEGIN{IGNORECASE=1}
            /warning/ {
              # attempt to extract file and line
              match($0, /([^ ]+\.cs)\(([0-9]+),([0-9]+)\):[[:space:]]warning[[:space:]]([^:]+):[[:space:]](.*)/, a);
              if (a[1]!="") {
                printf("::warning file=%s,line=%s::%s: %s\n", a[1], a[2], a[4], a[5])
              } else {
                # fallback: print as generic warning
                msg=$0;
                gsub(/%/,"%%",msg);
                print "::warning ::" msg
              }
            }' /tmp/ci_build_output.txt || true

