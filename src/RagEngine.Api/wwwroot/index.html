<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RagEngine — Consulta de Documentación</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    overflow: hidden; /* el scroll vive solo adentro de #chat-log */
  }

  /* ── Barra superior fija ─────────────────────────────────────── */
  header {
    flex: 0 0 auto;
    padding: 0.9rem 1.25rem;
    border-bottom: 1px solid rgba(127, 127, 127, 0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 1.05rem;
    margin: 0;
    white-space: nowrap;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  /* ── Historial de chat (única zona con scroll) ───────────────── */
  #chat-log {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 1.25rem 1.25rem 0.5rem;
  }
  .chat-inner {
    max-width: 760px;
    margin: 0 auto;
  }
  .empty-hint {
    max-width: 760px;
    margin: 2rem auto;
    color: #888;
    font-size: 0.92rem;
    text-align: center;
  }

  .turn { margin-bottom: 1.1rem; display: flex; flex-direction: column; }
  .turn.user { align-items: flex-end; }
  .turn.assistant { align-items: flex-start; }
  .turn .role {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #888;
    margin-bottom: 0.25rem;
  }
  .turn.user .bubble {
    background: #2563eb;
    color: white;
    border-radius: 14px 14px 3px 14px;
    padding: 0.55rem 0.9rem;
    max-width: 85%;
    white-space: pre-wrap;
  }
  .turn.assistant .bubble {
    white-space: pre-wrap;
    background: rgba(127, 127, 127, 0.1);
    border: 1px solid rgba(127, 127, 127, 0.2);
    border-radius: 3px 14px 14px 14px;
    padding: 0.6rem 0.95rem;
    max-width: 85%;
  }
  .turn.assistant .bubble:empty::after {
    content: "▍";
    animation: blink 1s steps(2) infinite;
    color: #888;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .sources-inline { margin-top: 0.4rem; max-width: 85%; }
  .sources-inline summary {
    cursor: pointer;
    font-size: 0.78rem;
    color: #888;
    user-select: none;
  }

  /* ── Barra de entrada fija abajo ─────────────────────────────── */
  .composer {
    flex: 0 0 auto;
    border-top: 1px solid rgba(127, 127, 127, 0.25);
    padding: 0.75rem 1.25rem 1rem;
  }
  .composer-inner { max-width: 760px; margin: 0 auto; }
  #status {
    color: #888;
    font-size: 0.85rem;
    min-height: 1.1rem;
    margin-bottom: 0.35rem;
  }
  form { display: flex; gap: 0.5rem; }
  p.hint { color: #888; font-size: 0.82rem; margin: 0.5rem 0 0; }

  input[type=text] {
    flex: 1;
    padding: 0.6rem 0.75rem;
    font-size: 1rem;
    border: 1px solid #999;
    border-radius: 8px;
    background: transparent;
    color: inherit;
  }
  select {
    padding: 0.5rem 0.5rem;
    font-size: 0.85rem;
    border: 1px solid #999;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    max-width: 11rem;
  }
  button {
    padding: 0.6rem 1.1rem;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    background: transparent;
    color: inherit;
    border: 1px solid #999;
  }
  #new-chat-btn { font-size: 0.85rem; padding: 0.4rem 0.8rem; }

  /* ── Fragmentos recuperados (dentro de un turno o del modal de Buscar) ─ */
  .source {
    font-size: 0.85rem;
    border-top: 1px solid rgba(127, 127, 127, 0.2);
    padding: 0.6rem 0;
  }
  .source .meta { color: #888; margin-bottom: 0.4rem; }
  .source .fragment {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    white-space: pre-wrap;
    background: rgba(127, 127, 127, 0.1);
    border: 1px solid rgba(127, 127, 127, 0.25);
    border-radius: 6px;
    padding: 0.6rem 0.75rem;
    max-height: 220px;
    overflow-y: auto;
    margin: 0;
  }

  /* ── Modal de resultados de "Buscar" (no toca el chat) ───────── */
  #search-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 10;
    padding: 3vh 1rem;
    overflow-y: auto;
  }
  #search-modal .panel {
    max-width: 760px;
    margin: 0 auto;
    background: Canvas;
    color: CanvasText;
    border-radius: 10px;
    padding: 1.25rem 1.4rem;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }
  #search-modal .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
  }
  #search-modal .panel-header h2 { font-size: 1rem; margin: 0; }
</style>
</head>
<body>
  <header>
    <h1>RagEngine — Consulta de Documentación</h1>
    <div class="header-actions">
      <select id="collection"><option>Cargando colecciones...</option></select>
      <button type="button" id="new-chat-btn" class="secondary" title="Empezar una conversación nueva">Nuevo chat</button>
    </div>
  </header>

  <main id="chat-log"><div class="chat-inner"></div></main>

  <div class="composer">
    <div class="composer-inner">
      <div id="status"></div>
      <form id="ask-form">
        <input type="text" id="query" placeholder="¿Cómo funciona la encuesta de satisfacción?" autofocus>
        <button type="submit" id="ask-btn">Preguntar</button>
        <button type="button" id="search-btn" class="secondary">Buscar</button>
      </form>
      <p class="hint">"Preguntar" genera una respuesta con el LLM y mantiene el hilo de la conversación; "Buscar" solo trae los fragmentos relevantes en una ventana aparte, sin generar respuesta ni afectar el chat.</p>
    </div>
  </div>

  <div id="search-modal">
    <div class="panel">
      <div class="panel-header">
        <h2>Fuentes encontradas</h2>
        <button type="button" id="search-modal-close" class="secondary">Cerrar</button>
      </div>
      <div id="sources"></div>
    </div>
  </div>

<script>
const form = document.getElementById('ask-form');
const queryInput = document.getElementById('query');
const statusEl = document.getElementById('status');
const chatLogEl = document.getElementById('chat-log');
const chatInnerEl = chatLogEl.querySelector('.chat-inner');
const searchModal = document.getElementById('search-modal');
const searchModalClose = document.getElementById('search-modal-close');
const sourcesEl = document.getElementById('sources');
const askBtn = document.getElementById('ask-btn');
const searchBtn = document.getElementById('search-btn');
const newChatBtn = document.getElementById('new-chat-btn');
const collectionSelect = document.getElementById('collection');

// Sin sesión en el servidor: el historial vive solo en esta pestaña (memoria JS)
// y se reenvía completo en cada /api/ask/stream — así el backend sigue stateless.
let chatHistory = [];

function setBusy(busy) {
  askBtn.disabled = busy;
  searchBtn.disabled = busy;
}

// El usuario puede scrollear hacia arriba para releer sin que el stream lo
// arrastre de vuelta abajo; solo autoscrolleamos si ya estaba cerca del final.
function isNearBottom() {
  return chatLogEl.scrollHeight - chatLogEl.scrollTop - chatLogEl.clientHeight < 100;
}
function scrollToBottom() {
  chatLogEl.scrollTop = chatLogEl.scrollHeight;
}

function buildSourcesFragment(sources) {
  const wrap = document.createElement('div');
  for (const s of sources) {
    const div = document.createElement('div');
    div.className = 'source';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${s.file}${s.section ? ' — ' + s.section : ''} (L${s.startLine}-${s.endLine}, score ${s.score.toFixed(2)})`;
    div.appendChild(meta);

    const fragment = document.createElement('pre');
    fragment.className = 'fragment';
    fragment.textContent = s.content;
    div.appendChild(fragment);

    wrap.appendChild(div);
  }
  return wrap;
}

function renderChatLog() {
  const wasNearBottom = isNearBottom();
  chatInnerEl.innerHTML = '';

  if (!chatHistory.length) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = 'Pregunta en lenguaje natural sobre la documentación indexada en este equipo. Podés hacer preguntas de seguimiento — la conversación se mantiene en esta pestaña.';
    chatInnerEl.appendChild(hint);
    return null;
  }

  for (const turn of chatHistory) {
    const div = document.createElement('div');
    div.className = `turn ${turn.role}`;

    const roleLabel = document.createElement('div');
    roleLabel.className = 'role';
    roleLabel.textContent = turn.role === 'user' ? 'Vos' : 'RagEngine';
    div.appendChild(roleLabel);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = turn.content;
    div.appendChild(bubble);

    // Cada turno guarda sus propias fuentes — no se pisan entre preguntas
    // de seguimiento, así podés revisar de dónde salió cada respuesta.
    if (turn.sources && turn.sources.length) {
      const details = document.createElement('details');
      details.className = 'sources-inline';
      const summary = document.createElement('summary');
      summary.textContent = `Fuentes (${turn.sources.length})`;
      details.appendChild(summary);
      details.appendChild(buildSourcesFragment(turn.sources));
      div.appendChild(details);
    }

    chatInnerEl.appendChild(div);
  }

  if (wasNearBottom) scrollToBottom();
  return chatInnerEl.lastElementChild?.querySelector('.bubble');
}
renderChatLog();

function startNewChat() {
  chatHistory = [];
  renderChatLog();
  statusEl.textContent = '';
  queryInput.focus();
}
newChatBtn.addEventListener('click', startNewChat);

function openSearchModal() { searchModal.style.display = 'block'; }
function closeSearchModal() { searchModal.style.display = 'none'; }
searchModalClose.addEventListener('click', closeSearchModal);
searchModal.addEventListener('click', (e) => { if (e.target === searchModal) closeSearchModal(); });

// La colección ya no queda fija a un proyecto — se descubre en vivo contra
// Qdrant, así la misma página sirve para cualquier colección que se ingeste.
async function loadCollections() {
  try {
    const res = await fetch('/api/collections');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    collectionSelect.innerHTML = '';
    for (const name of data.collections) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      collectionSelect.appendChild(opt);
    }
    if (data.default && data.collections.includes(data.default)) {
      collectionSelect.value = data.default;
    }
  } catch (err) {
    collectionSelect.innerHTML = '<option value="">(no se pudo cargar — revisa Qdrant)</option>';
    statusEl.textContent = 'No se pudieron listar las colecciones: ' + err.message;
  }
}
loadCollections();

// Recorta un título de sección para el status en vivo: "US-17.2 — Finalización
// automática de Tickets con plazo vencido" -> se queda con lo esencial, no el
// fragmento entero. Solo cosmético.
function shortTitle(s) {
  const label = s.section || s.file;
  return label.length > 60 ? label.slice(0, 57) + '…' : label;
}

// /api/search es rápido (sin LLM) y no toca el chat — se muestra en un modal aparte.
async function runSearch() {
  const query = queryInput.value.trim();
  if (!query) return;

  setBusy(true);
  statusEl.textContent = 'Buscando...';

  try {
    const res = await fetch('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, collection: collectionSelect.value, topK: 10, rerank: true })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }

    const sources = await res.json();
    sourcesEl.innerHTML = '';
    sourcesEl.appendChild(buildSourcesFragment(sources));
    openSearchModal();
    statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
  } finally {
    setBusy(false);
  }
}

// /api/ask/stream va emitiendo eventos (SSE) según avanza el pipeline real:
// primero qué se encontró, luego la respuesta token a token. El status en
// pantalla refleja eso — no es un mensaje fijo de "espera", ni un log crudo.
async function runAskStream() {
  const query = queryInput.value.trim();
  if (!query) return;

  setBusy(true);
  statusEl.textContent = 'Buscando en la documentación...';

  // El historial previo (sin el turno actual) es lo que va en el request —
  // el servidor no guarda sesión, así que se lo mandamos completo cada vez.
  const historyForRequest = chatHistory.map(t => ({ role: t.role, content: t.content }));

  const currentTurn = { role: 'assistant', content: '', sources: [] };
  chatHistory.push({ role: 'user', content: query });
  chatHistory.push(currentTurn);
  const assistantBubble = renderChatLog();
  scrollToBottom();
  queryInput.value = '';

  try {
    const res = await fetch('/api/ask/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query,
        collection: collectionSelect.value,
        topK: 10,
        rerank: true,
        history: historyForRequest
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let sep;
      while ((sep = buffer.indexOf('\n\n')) !== -1) {
        const rawEvent = buffer.slice(0, sep);
        buffer = buffer.slice(sep + 2);

        let eventName = 'message';
        let dataLine = '';
        for (const line of rawEvent.split('\n')) {
          if (line.startsWith('event:')) eventName = line.slice(6).trim();
          else if (line.startsWith('data:')) dataLine += line.slice(5).trim();
        }
        if (!dataLine) continue;
        const payload = JSON.parse(dataLine);

        if (eventName === 'status') {
          statusEl.textContent = payload.message;
        } else if (eventName === 'sources') {
          // Quedan colgadas del turno del asistente que se está armando —
          // se pintan recién cuando termine, junto con la respuesta.
          currentTurn.sources = payload.sources;
          if (payload.sources.length) {
            const titles = payload.sources.slice(0, 3).map(shortTitle).join(' · ');
            statusEl.textContent = `Encontrado en: ${titles}`;
          }
        } else if (eventName === 'token') {
          currentTurn.content += payload.text;
          assistantBubble.textContent += payload.text;
          if (isNearBottom()) scrollToBottom();
        } else if (eventName === 'done') {
          statusEl.textContent = '';
          renderChatLog(); // agrega el desplegable de fuentes ya con la respuesta completa
        }
      }
    }
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
    // El turno del asistente quedó vacío/incompleto — lo sacamos del historial
    // para no mandarle al LLM un turno roto en el siguiente follow-up.
    if (chatHistory.length && chatHistory[chatHistory.length - 1].content === '') {
      chatHistory.pop();
      chatHistory.pop();
      renderChatLog();
    }
  } finally {
    setBusy(false);
    queryInput.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  runAskStream();
});

searchBtn.addEventListener('click', runSearch);
</script>
</body>
</html>
